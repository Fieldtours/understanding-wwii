<script id="routepdf-js">
(function(){
"use strict";
const LIBS=["lib/jspdf.umd.min.js","lib/qrcode.js"];
const A4W=210,A4H=297,M=14,BOT=283;

/* ---------- small helpers ---------- */
function loadLib(src){return new Promise((ok,ko)=>{if(document.querySelector('script[data-rp="'+src+'"]'))return ok();
  const s=document.createElement("script");s.src=src;s.dataset.rp=src;s.onload=ok;s.onerror=()=>ko(new Error("Could not load "+src));document.head.appendChild(s)})}
const cssVar=(n,d)=>{const v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||d};
const short=n=>String(n).split(/ — | \/ |, |: /)[0];
const hm=m=>apHm(m);
const clock=m=>{m=Math.round(m);return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const T0=document.title;const guideName=()=>String(window.__T0||T0).split(/:| — | \| /)[0].trim();
/* the built-in PDF letters only know Western European characters: replace or simplify the rest */
const EXTRA="€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ";
const REPL={"→":"->","←":"<-","↔":"<->","≈":"~","−":"-","′":"'","″":'"',"ł":"l","Ł":"L","đ":"d","Đ":"D","ı":"i","ŀ":"l","ő":"o","ű":"u","ș":"s","ț":"t","Ș":"S","Ț":"T","ą":"a","ę":"e","ć":"c","ń":"n","ś":"s","ź":"z","ż":"z","č":"c","ř":"r","ě":"e","ů":"u","ğ":"g","ş":"s"," ":" "," ":" "," ":" ","‑":"-","‐":"-","✕":"x","✓":"v"};
function T(s){s=String(s==null?"":s);let o="";for(const ch of s){const c=ch.codePointAt(0);
  if((c>=32&&c<=126)||(c>=160&&c<=255)||EXTRA.includes(ch)){o+=ch;continue}
  if(REPL[ch]!=null){o+=REPL[ch];continue}
  const b=ch.normalize("NFD").replace(/[̀-ͯ]/g,"");if(b&&b!==ch&&[...b].every(x=>x.codePointAt(0)<256)){o+=b;continue}
  if(c===10)o+=" "}
  return o.replace(/\s+/g," ").trim()}
function sentences(t,n){t=String(t||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();if(!t)return "";
  const p=t.split(/(?<=[.!?])\s+(?=[A-Z0-9‘'"(])/);return p.slice(0,n).join(" ")}
const hex2rgb=h=>{h=h.replace("#","");if(h.length===3)h=h.split("").map(x=>x+x).join("");const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]};
const google1=(la,lo)=>"https://www.google.com/maps/search/?api=1&query="+la.toFixed(5)+","+lo.toFixed(5);
function dayLink(ds,b){const pts=ds.map(p=>p.lat.toFixed(5)+","+p.lon.toFixed(5));if(b)pts.push(b.lat.toFixed(5)+","+b.lon.toFixed(5));
  return "https://www.google.com/maps/dir/"+pts.slice(0,10).join("/")}

/* ---------- the plan, in the same order and with the same times as the app ---------- */
function makePlan(){
  const days=myBuild();const out=[];
  days.forEach((ds,di)=>{
    const b=ds.length?baseFor(ds,di===days.length-1,days[di+1]):null;
    const prevB=di>0&&out[di-1]?out[di-1].base:null;
    const rows=[];let t=9*60,drv=0,km=0,vis=0,lunch=false,cur=null;
    if(prevB&&ds.length){rows.push({k:"leave",t,name:prevB.base});cur=[prevB.lat,prevB.lon]}
    ds.forEach((p,i)=>{
      if(cur){const k=apKm(cur[0],cur[1],p.lat,p.lon),m=apDrive(k);if(m>0){rows.push({k:"drive",m,km:k});t+=m;drv+=m;km+=k}}
      rows.push({k:"stop",n:i+1,p,t,m:p.min});t+=p.min;vis+=p.min;cur=[p.lat,p.lon];
      if(!lunch&&t>=12*60&&i<ds.length-1){rows.push({k:"lunch",t});t+=60;lunch=true}});
    if(b&&cur){const k=apKm(cur[0],cur[1],b.lat,b.lon),m=apDrive(k);if(m>0){rows.push({k:"drive",m,km:k});t+=m;drv+=m;km+=k}rows.push({k:"sleep",t,name:b.base})}
    out.push({n:di+1,ds,base:b,rows,drv,km:Math.round(km),vis,end:t,link:ds.length?dayLink(ds,b):""})});
  return out}

/* ---------- maps: the guide's own map pictures, drawn on a canvas ---------- */
function loadImg(u){return new Promise(ok=>{const i=new Image();let done=false;const fin=v=>{if(!done){done=true;ok(v)}};
  i.onload=()=>fin(i);i.onerror=()=>fin(null);setTimeout(()=>fin(null),9000);i.src=u})}
async function mapImage(groups,sleeps,Wc,Hc){
  const S=2,cv=document.createElement("canvas");cv.width=Wc*S;cv.height=Hc*S;const g=cv.getContext("2d");g.scale(S,S);
  const all=groups.flatMap(x=>x.pts).concat(sleeps);
  let la0=Math.min(...all.map(p=>p.lat)),la1=Math.max(...all.map(p=>p.lat)),lo0=Math.min(...all.map(p=>p.lon)),lo1=Math.max(...all.map(p=>p.lon));
  const minW=0.12;if(lo1-lo0<minW){const c=(lo0+lo1)/2;lo0=c-minW/2;lo1=c+minW/2}
  if(la1-la0<minW*0.6){const c=(la0+la1)/2;la0=c-minW*0.3;la1=c+minW*0.3}
  const pad=34,w=lo1-lo0,h=MY(la1)-MY(la0);
  const sc=Math.min((Wc-2*pad)/w,(Hc-2*pad)/h),cx=(lo0+lo1)/2,cy=(MY(la0)+MY(la1))/2;
  const X=lo=>Wc/2+(lo-cx)*sc,Y=la=>Hc/2-(MY(la)-cy)*sc;
  g.fillStyle="#ece8dc";g.fillRect(0,0,Wc,Hc);
  try{const vx0=cx-Wc/2/sc,vx1=cx+Wc/2/sc,vy0=cy-Hc/2/sc,vy1=cy+Hc/2/sc;
    const tiles=rasPick(sc*S,vx0,vx1,vy0,vy1,MY);
    const imgs=await Promise.all(tiles.map(r=>loadImg(r.url||r.src)));
    tiles.forEach((r,i)=>{const im=imgs[i];if(!im)return;const x=Wc/2+(r.b[0]-cx)*sc,y=Hc/2-(MY(r.b[3])-cy)*sc;
      g.drawImage(im,x,y,(r.b[2]-r.b[0])*sc,(MY(r.b[3])-MY(r.b[1]))*sc)})}catch(e){}
  g.fillStyle="rgba(239,235,224,.15)";g.fillRect(0,0,Wc,Hc);
  groups.forEach(G=>{if(G.pts.length<2&&!G.tail)return;g.save();g.strokeStyle=G.col;g.lineWidth=3;g.setLineDash([9,6]);g.lineCap="round";g.beginPath();
    G.pts.concat(G.tail?[G.tail]:[]).forEach((p,i)=>i?g.lineTo(X(p.lon),Y(p.lat)):g.moveTo(X(p.lon),Y(p.lat)));g.stroke();g.restore()});
  sleeps.forEach(s=>{const x=X(s.lon),y=Y(s.lat);g.fillStyle="#1b2631";g.strokeStyle="#fff";g.lineWidth=2.5;g.beginPath();g.rect(x-10,y-10,20,20);g.fill();g.stroke();
    g.fillStyle="#fff";g.beginPath();g.arc(x,y,5.5,0,Math.PI*2);g.fill();g.fillStyle="#1b2631";g.beginPath();g.arc(x+2.6,y-1.6,5,0,Math.PI*2);g.fill()});
  groups.forEach(G=>G.pts.forEach(p=>{const x=X(p.lon),y=Y(p.lat);g.fillStyle=G.col;g.strokeStyle="#fff";g.lineWidth=2.5;g.beginPath();g.arc(x,y,11,0,Math.PI*2);g.fill();g.stroke();
    g.fillStyle="#fff";g.font="bold 12px Helvetica,Arial,sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText(String(p.n),x,y+.5)}));
  /* scale bar */
  const kmPerPx=111.32*Math.cos((la0+la1)/2*Math.PI/180)/sc,want=Wc*0.16*kmPerPx;
  const nice=[1,2,5,10,20,50,100,200,500].reduce((a,v)=>Math.abs(v-want)<Math.abs(a-want)?v:a,1),bw=nice/kmPerPx;
  const bx=Wc-bw-16,by=Hc-14;g.fillStyle="rgba(255,255,255,.88)";g.fillRect(bx-8,by-17,bw+16,24);g.strokeStyle="#1b1f24";g.lineWidth=2;g.setLineDash([]);
  g.beginPath();g.moveTo(bx,by);g.lineTo(bx+bw,by);g.stroke();g.fillStyle="#1b1f24";g.font="11px Helvetica,Arial,sans-serif";g.textAlign="center";g.textBaseline="alphabetic";g.fillText(nice+" km",bx+bw/2,by-5);
  g.fillStyle="rgba(255,255,255,.8)";g.fillRect(0,Hc-14,190,14);g.fillStyle="#444";g.font="9px Helvetica,Arial,sans-serif";g.textAlign="left";g.fillText("Map © OpenStreetMap contributors",5,Hc-4);
  return cv.toDataURL("image/jpeg",0.86)}

/* ---------- headings in the guide's own stencil lettering ---------- */
async function headingImg(txt,pt,col,maxW){
  const disp=cssVar("--disp","Impact,sans-serif");try{await document.fonts.load("800 40px "+disp)}catch(e){}
  const PXMM=12;let fs=pt*0.3528*PXMM;const c=document.createElement("canvas"),g=c.getContext("2d");
  const set=()=>{g.font="800 "+fs+"px "+disp};set();let lines=[txt];
  const fit=()=>{const words=txt.split(" ");lines=[];let cur="";words.forEach(w=>{const t=cur?cur+" "+w:w;if(g.measureText(t).width>maxW*PXMM&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur)};
  fit();while(lines.length>2&&fs>8){fs*=0.9;set();fit()}
  const lh=fs*1.0,wpx=Math.ceil(Math.max(...lines.map(l=>g.measureText(l).width)))+4,hpx=Math.ceil(lh*lines.length+fs*0.18);
  c.width=wpx;c.height=hpx;set();g.fillStyle=col;g.textBaseline="top";lines.forEach((l,i)=>g.fillText(l,0,i*lh+fs*0.06));
  return{d:c.toDataURL("image/png"),w:wpx/PXMM,h:hpx/PXMM}}

/* ---------- QR codes, drawn as real shapes so they print sharp ---------- */
function qrDraw(doc,url,x,y,size){
  try{const q=qrcode(0,"M");q.addData(url);q.make();const n=q.getModuleCount(),qz=1,u=size/(n+2*qz);
    doc.setFillColor(255,255,255);doc.rect(x,y,size,size,"F");doc.setFillColor(20,20,20);
    for(let r=0;r<n;r++){let c=0;while(c<n){if(q.isDark(r,c)){let e=c;while(e<n&&q.isDark(r,e))e++;doc.rect(x+(qz+c)*u,y+(qz+r)*u,(e-c)*u+0.01,u+0.01,"F");c=e}else c++}}}catch(e){}}

/* ---------- build the PDF ---------- */
async function buildPdf(){

  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4",compress:true});

  const col=i=>COLS[i%COLS.length];
  const nDays=plan.length,nStops=plan.reduce((s,d)=>s+d.ds.length,0);
  const made=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  const site=location.host.replace(/^www\./,"");

  const LH=sz=>sz*0.3528*1.32;
  function header(){fill(BRAND);doc.rect(0,0,A4W,15,"F");txtc("#ffffff");font("courier","bold",7);doc.text(T("DZ CHARLIE FIELD GUIDE"),M,6);
    font("helvetica","bold",10.5);doc.text(T(guide.toUpperCase()+" · MY ROUTE"),M,11.2);
    font("courier","normal",7.5);doc.text(T(nDays+" day"+(nDays>1?"s":"")+" · "+nStops+" stop"+(nStops>1?"s":"")),A4W-M,11.2,{align:"right"})}
  function footer(){draw("#e2dccb");doc.setLineWidth(0.2);doc.line(M,288,A4W-M,288);txtc("#8f979f");font("courier","normal",6.8);
    doc.text(T(site),M,292);doc.text(T("Made "+made+" · check opening times before you go"),A4W/2,292,{align:"center"});doc.text("Page "+page,A4W-M,292,{align:"right"})}
  function newPage(){if(page)doc.addPage();page++;header();footer();y=22}
  const room=h=>{if(y+h>BOT)newPage()};
  function para(txt,x,w,sz,color,style){if(!txt)return 0;font("helvetica",style||"normal",sz);txtc(color||"#1b1f24");const L=doc.splitTextToSize(T(txt),w);doc.text(L,x,y,{baseline:"top",lineHeightFactor:1.32});const h=L.length*LH(sz);y+=h;return h}
  const measure=(txt,w,sz,style)=>{if(!txt)return 0;font("helvetica",style||"normal",sz);return doc.splitTextToSize(T(txt),w).length*LH(sz)};

  /* ===== page 1: overview ===== */
  newPage();
  txtc(ACC);font("courier","bold",8.5);doc.text("YOUR OWN ROUTE",M,y+3);y+=7;
  const first=short(plan[0].ds[0].name),lastD=plan[plan.length-1],last=short(lastD.ds[lastD.ds.length-1].name);
  const H1=await headingImg(("My route: "+first+(nStops>1&&last!==first?" to "+last:"")).toUpperCase(),34,"#1b1f24",A4W-2*M);doc.addImage(H1.d,"PNG",M,y,H1.w,H1.h);y+=H1.h+2;
  const totV=plan.reduce((s,d)=>s+d.vis,0),totD=plan.reduce((s,d)=>s+d.drv,0),totK=plan.reduce((s,d)=>s+d.km,0);
  para(nDays+" day"+(nDays>1?"s":"")+" · "+nStops+" stop"+(nStops>1?"s":"")+" · about "+hm(totV)+" of visits and "+hm(totD)+" of driving ("+totK+" km). Each day is in driving order and starts at 09:00.",M,A4W-2*M,10.5,"#3a3f46");y+=3;
  const ovH=88,ovW=A4W-2*M;
  const ov=await mapImage(plan.map((d,i)=>({col:col(i),pts:d.ds.map((p,j)=>({lat:p.lat,lon:p.lon,n:j+1})),tail:d.base?{lat:d.base.lat,lon:d.base.lon}:null})),plan.filter(d=>d.base).map(d=>({lat:d.base.lat,lon:d.base.lon})),Math.round(ovW*4.9),Math.round(ovH*4.9));
  doc.addImage(ov,"JPEG",M,y,ovW,ovH);draw("#d8d1bd");doc.setLineWidth(0.3);doc.roundedRect(M,y,ovW,ovH,2,2,"S");y+=ovH+2;
  txtc("#6b717b");font("helvetica","normal",7);doc.text(T("Numbers = stops in visiting order, one colour per day · black squares = where to sleep · dashed line = order of visit, not the road"),M,y+2);y+=7;
  /* at a glance */
  const cx=[M,M+16,M+80,M+94,M+118,M+150];const heads=["DAY","FROM – TO","STOPS","VISITING","DRIVING","SLEEP IN"];
  const tHead=()=>{font("courier","bold",7);txtc("#6b717b");heads.forEach((h,i)=>doc.text(h,cx[i],y+3));y+=5;draw(BRAND);doc.setLineWidth(0.4);doc.line(M,y,A4W-M,y);y+=1.5};
  tHead();
  plan.forEach((d,i)=>{const ft=short(d.ds[0].name)+(d.ds.length>1?" – "+short(d.ds[d.ds.length-1].name):"");
    font("helvetica","normal",8.6);const L=doc.splitTextToSize(T(ft),62),sl=doc.splitTextToSize(T(d.base?d.base.base:"-"),A4W-M-cx[5]);
    const h=Math.max(L.length,sl.length,1)*LH(8.6)+2.6;if(y+h>BOT){newPage();tHead()}
    fill(col(i));doc.circle(cx[0]+1.3,y+2.4,1.3,"F");font("helvetica","bold",8.6);txtc("#1b1f24");doc.text("Day "+d.n,cx[0]+4,y+1,{baseline:"top"});
    font("helvetica","normal",8.6);doc.text(L,cx[1],y+1,{baseline:"top",lineHeightFactor:1.32});doc.text(String(d.ds.length),cx[2],y+1,{baseline:"top"});
    doc.text(T(hm(d.vis)),cx[3],y+1,{baseline:"top"});doc.text(T(hm(d.drv)+" · "+d.km+" km"),cx[4],y+1,{baseline:"top"});doc.text(sl,cx[5],y+1,{baseline:"top",lineHeightFactor:1.32});
    y+=h;draw("#e2dccb");doc.setLineWidth(0.2);doc.line(M,y,A4W-M,y);y+=0.8});
  if(nDays>1){room(8);font("helvetica","bold",8.6);txtc("#1b1f24");doc.text("Total",cx[0],y+1.5,{baseline:"top"});doc.text(String(nStops),cx[2],y+1.5,{baseline:"top"});doc.text(T(hm(totV)),cx[3],y+1.5,{baseline:"top"});doc.text(T(hm(totD)+" · "+totK+" km"),cx[4],y+1.5,{baseline:"top"});y+=8}
  y+=4;
  const tips=["Each day starts at 09:00; the times are a guide.","Scan the code at the top of a day to open the whole day in Google Maps.","Every stop has its own code too, to drive straight there.","Opening times and prices change: check before you go."];

  const y0=y;y+=3.5;txtc(ACC);font("courier","bold",7.5);doc.text("HOW TO USE THIS",M+5,y+2);y+=4.5;tips.forEach(t=>para("•  "+t,M+5,A4W-2*M-10,8.6,"#1b1f24"));y=y0+tipH;

  /* ===== one section per day ===== */
  for(let di=0;di<plan.length;di++){

    const HD=await headingImg(ttl,20,"#ffffff",A4W-2*M-46);const barH=Math.max(24,HD.h+12);
    fill(C);doc.rect(0,y-3,A4W,barH,"F");doc.addImage(HD.d,"PNG",M,y,HD.w,HD.h);
    txtc("#ffffff");font("helvetica","normal",8.2);doc.text(T(d.ds.length+" stop"+(d.ds.length>1?"s":"")+" · visits "+hm(d.vis)+" + driving "+hm(d.drv)+" ("+d.km+" km) · 09:00 to about "+clock(d.end)),M,y+HD.h+2.5,{baseline:"top"});
    const qs=barH-6;qrDraw(doc,d.link,A4W-M-qs,y,qs);font("helvetica","normal",6.6);doc.text(["Scan to drive","the whole day","in Google Maps"],A4W-M-qs-2,y+qs/2-3,{align:"right",baseline:"top",lineHeightFactor:1.25});
    y+=barH+1;
    /* map + timetable */
    const mW=88,mH=74,sy=y;
    const dm=await mapImage([{col:C,pts:d.ds.map((p,j)=>({lat:p.lat,lon:p.lon,n:j+1})),tail:d.base?{lat:d.base.lat,lon:d.base.lon}:null}],d.base?[{lat:d.base.lat,lon:d.base.lon}]:[],Math.round(mW*6),Math.round(mH*6));
    doc.addImage(dm,"JPEG",M,y,mW,mH);draw("#d8d1bd");doc.setLineWidth(0.3);doc.roundedRect(M,y,mW,mH,2,2,"S");
    const tx=M+mW+6,tw=A4W-M-tx;let ty=y;
    const dot=(cx_,cy_,c,label)=>{fill(c);doc.circle(cx_,cy_,2.6,"F");txtc("#ffffff");font("helvetica","bold",7.5);doc.text(label,cx_,cy_+0.1,{align:"center",baseline:"middle"})};
    d.rows.forEach(r=>{
      if(r.k==="drive"){draw("#c9c1aa");doc.setLineWidth(0.5);doc.setLineDashPattern([0.8,0.8],0);doc.line(tx+15.5,ty-0.3,tx+15.5,ty+4.3);doc.setLineDashPattern([],0);
        txtc("#6b717b");font("helvetica","normal",7.4);doc.text(T("drive about "+hm(r.m)+" · "+Math.round(r.km)+" km"),tx+19.5,ty+0.6,{baseline:"top"});ty+=4.6;return}
      font("courier","bold",8.4);txtc("#1b1f24");doc.text(clock(r.t),tx,ty+2.4,{baseline:"middle"});
      let nm,sub,c,lab;
      if(r.k==="stop"){nm=r.p.name;sub="Visit "+hm(r.m);c=C;lab=String(r.n)}
      else if(r.k==="lunch"){nm="Lunch break";sub="about 1 h";c="#8f979f";lab="L"}
      else if(r.k==="leave"){nm="Leave "+r.name;sub="where you slept";c="#1b2631";lab="Z"}
      else{nm="Arrive "+r.name;sub="sleep here · end of Day "+d.n;c="#1b2631";lab="Z"}
      dot(tx+15.5,ty+2.4,c,lab);font("helvetica","bold",8.4);txtc("#1b1f24");const L=doc.splitTextToSize(T(nm),tw-20);doc.text(L,tx+19.5,ty,{baseline:"top",lineHeightFactor:1.2});
      const h=L.length*8.4*0.3528*1.2;txtc("#6b717b");font("helvetica","normal",7.2);doc.text(T(sub),tx+19.5,ty+h+0.2,{baseline:"top"});ty+=h+4.6});
    y=Math.max(sy+mH,ty)+2;txtc("#6b717b");font("helvetica","normal",6.8);doc.text(T("Dashed line = order of visit, not the road · drive times are estimates"),M,y);y+=4;
    /* stop cards */
    d.ds.forEach((p,i)=>{
      const bx=M+10,bw=A4W-M-bx-27;
      const hist=sentences(p.text,2),look=sentences(p.look,1),prac=String(p.plan||"").replace(/<[^>]+>/g," ").replace(/\s*Check the website before you go\.?/i,"").trim();
      const meta=[p.cat,"visit "+hm(p.min)].filter(Boolean).join(" · ");
      let h=3+measure(p.name,bw,11,"bold")+LH(8)+1.5;if(hist)h+=4+measure(hist,bw,8.8)+1;if(look)h+=4+measure(look,bw,8.8)+1;if(prac)h+=4+measure(prac,bw-5,8)+4;h=Math.max(h,30)+2;
      if(y+h>BOT)newPage();
      draw("#e2dccb");doc.setLineWidth(0.25);doc.line(M,y,A4W-M,y);const top=y;y+=3;
      fill(C);doc.circle(M+4,y+3.6,3.6,"F");txtc("#ffffff");font("helvetica","bold",10);doc.text(String(i+1),M+4,y+3.7,{align:"center",baseline:"middle"});
      para(p.name,bx,bw,11,"#1b1f24","bold");
      font("helvetica","normal",8);txtc("#6b717b");doc.text(T(meta),bx,y+0.5,{baseline:"top"});
      if(p.conf){const cw=doc.getTextWidth(T(meta))+2;const cc={HIGH:"#3d6b2a",DOC:"#2f4358",MEDIUM:"#b07a12",LOW:"#8a2b1c"}[p.conf]||"#6b717b";font("helvetica","bold",6.2);const bw2=doc.getTextWidth(p.conf)+2.6;fill(cc);doc.roundedRect(bx+cw,y+0.3,bw2,3.4,0.6,0.6,"F");txtc("#ffffff");doc.text(p.conf,bx+cw+1.3,y+2.05,{baseline:"middle"})}
      y+=LH(8)+1.5;
      const lab=t=>{txtc(ACC);font("courier","bold",7);doc.text(t,bx,y+2.2);y+=3.6};
      if(hist){lab("WHAT HAPPENED");para(hist,bx,bw,8.8);y+=1}
      if(look){lab("WHAT YOU SEE TODAY");para(look,bx,bw,8.8);y+=1}
      if(prac){const ph=measure(prac,bw-5,8)+7;fill("#f2eee2");doc.roundedRect(bx,y,bw,ph,1.2,1.2,"F");y+=1.6;txtc(ACC);font("courier","bold",7);doc.text("PRACTICAL",bx+2.5,y+2.2);y+=3.6;para(prac,bx+2.5,bw-5,8,"#3a3f46");y+=1.8}
      qrDraw(doc,google1(p.lat,p.lon),A4W-M-21,top+3.5,21);txtc("#6b717b");font("helvetica","normal",6.2);
      doc.text(["Directions",p.lat.toFixed(4)+", "+p.lon.toFixed(4)],A4W-M-10.5,top+26.5,{align:"center",baseline:"top",lineHeightFactor:1.2});
      y=Math.max(y,top+h)});
    /* where to sleep */
    if(d.base){const b=d.base,lines=["Good area to stay: "+b.base+". In the app, the tour planner links straight to hotels, Airbnb and campsites around there."];
      if(b.name)lines.push("Campsite or motorhome area we suggest: "+b.name+(b.addr?", "+b.addr:"")+(b.info?" · "+b.info:""));
      const bh=9+lines.reduce((s,l)=>s+measure(l,A4W-2*M-12,8.4),0)+2;room(bh+3);y+=3;
      fill("#1b2631");doc.roundedRect(M,y,A4W-2*M,bh,2,2,"F");const yy=y;y+=4;txtc("#ffffff");font("helvetica","bold",10.5);doc.text(T("End of Day "+d.n+": sleep in "+b.base),M+6,y,{baseline:"top"});y+=5.5;
      lines.forEach(l=>para(l,M+6,A4W-2*M-12,8.4,"#e8e4d8"));y=yy+bh}
  }
  const fname=T("My route - "+guide+" - "+nDays+" day"+(nDays>1?"s":"")).replace(/[\\/:*?"<>|]+/g,"")+".pdf";
  return{blob:doc.output("blob"),name:fname}}

/* ---------- saving: download on a computer; on a phone, a sheet with Save / Share ---------- */
const mobile=()=>/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.rel="noopener";a.style.display="none";a.addEventListener("click",e=>e.stopPropagation());document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function readySheet(res){let el=document.getElementById("rpReady");if(el)el.remove();el=document.createElement("div");el.id="rpReady";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");
  el.innerHTML='<div class="in"><b>Your route PDF is ready</b><p>Save it to your phone, print it, or send it to someone.</p><button type="button" class="go">Save or share the PDF</button><button type="button" class="x">Close</button></div>';
  document.body.appendChild(el);
  el.querySelector(".go").onclick=async()=>{const f=new File([res.blob],res.name,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:res.name})}catch(e){}}else download(res.blob,res.name)};
  el.querySelector(".x").onclick=()=>el.remove();el.addEventListener("click",e=>{if(e.target===el)el.remove()})}
async function run(btn){
  if(btn.disabled)return;const old=btn.innerHTML;btn.disabled=true;btn.textContent="Making your PDF…";
  try{for(const l of LIBS)await loadLib(l);const res=await buildPdf();window.__rpLast=res;
    if(mobile())readySheet(res);else{download(res.blob,res.name);if(typeof toast==="function")toast("Route PDF downloaded")}}
  catch(e){console.error(e);if(typeof toast==="function")toast(navigator.onLine?"Sorry, the PDF could not be made. Please try again.":"The PDF needs the internet the first time. Please try again when you are online.")}
  finally{btn.disabled=false;btn.innerHTML=old}}

/* ---------- the button: under "Edit my route / Start again" whenever your own route is showing ---------- */
const BTN='<button type="button" class="rp-btn" data-rp="go"><span aria-hidden="true">⬇</span> Download Route PDF</button><p class="rp-note">Maps, times and every stop, ready to print or keep on your phone.</p>';
function place(){const box=document.getElementById("mybox");if(!box)return;const has=box.querySelector(".rp-btn");
  let on=false;try{on=myOn()&&myCount()>0}catch(e){}
  if(!on){if(has){has.nextElementSibling&&has.nextElementSibling.classList.contains("rp-note")&&has.nextElementSibling.remove();has.remove()}return}
  if(has)return;const row=box.querySelector(".ap-row");if(row)row.insertAdjacentHTML("afterend",BTN);else box.insertAdjacentHTML("beforeend",BTN)}
document.addEventListener("click",e=>{const b=e.target.closest('#mybox [data-rp="go"]');if(b){e.preventDefault();run(b)}});
if(typeof window.renderTour==="function"){const orig=window.renderTour;window.renderTour=function(){const r=orig.apply(this,arguments);try{place()}catch(e){}return r}}
const box=document.getElementById("mybox");if(box)new MutationObserver(()=>place()).observe(box,{childList:true});
place();
})();
</script>
