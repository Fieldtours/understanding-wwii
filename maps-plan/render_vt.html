  {id:'shields',type:'symbol',source:'omt','source-layer':'transportation_name',filter:['all',['match',['get','class'],['motorway','trunk','primary'],true,false],['has','ref'],['<=',['get','ref_length'],7]],layout:{'symbol-placement':'line','symbol-spacing':['interpolate',['linear'],['zoom'],5,700,8,500,10,320],'text-field':['get','ref'],'text-font':[FM],'text-size':11,'text-rotation-alignment':'viewport','icon-image':['match',['get','class'],'motorway','shieldR','shieldY'],'icon-text-fit':'both','icon-text-fit-padding':[2,4,2,4],'icon-rotation-alignment':'viewport'},paint:{'text-color':['match',['get','class'],'motorway','#ffffff','#3c4043']}},
  {id:'extra',type:'symbol',source:'extra',filter:['==',['get','kind'],'sea'],layout:{'text-field':['get','name'],'text-font':[FI],'text-size':14,'text-letter-spacing':0.12,'text-allow-overlap':true},paint:{'text-color':'#1a5f8f','text-halo-color':'#e8f4ff','text-halo-width':2}},
  {id:'countries',type:'symbol',source:'omt','source-layer':'place',maxzoom:7.5,filter:['==',['get','class'],'country'],layout:{'text-field':['upcase',['coalesce',['get','name:en'],NAME]],'text-font':[FM],'text-size':14,'text-letter-spacing':0.25,'text-max-width':8},paint:{'text-color':'#7b7394','text-halo-color':'#fff','text-halo-width':2}},
  {id:'towns',type:'symbol',source:'omt','source-layer':'place',filter:['match',['get','class'],['town','city'],true,false],layout:{'text-variable-anchor':['center','top','bottom','left','right'],'text-radial-offset':0.9,'text-field':NAME,'text-font':[FM],'text-size':['interpolate',['linear'],['zoom'],5,['match',['get','class'],'city',12,10.5],8,['match',['get','class'],'city',14,12.5],12,17],'text-max-width':8,'symbol-sort-key':['get','rank']},paint:{'text-color':'#202124','text-halo-color':'#fff','text-halo-width':2}},
 ]};
if(JOB.textScale){const k=JOB.textScale;style.layers.forEach(l=>{const t=l.layout&&l.layout['text-size'];if(t===undefined)return;
 const sc=v=>typeof v==='number'?v*k:(Array.isArray(v)&&v[0]==='match')?v.map((x,i)=>i>=3&&i%2===1&&typeof x==='number'||i===v.length-1&&typeof x==='number'?x*k:x):v;
 if(typeof t==='number')l.layout['text-size']=t*k;else if(t[0]==='match')l.layout['text-size']=sc(t);else if(t[0]==='interpolate')l.layout['text-size']=t.map((v,i)=>i>=3&&i%2===0?sc(v):v)})}

// virtual zoom: draw from more detailed tiles by zooming the map in by SHIFT levels while shrinking everything by the same factor
const SH=JOB.shift||0,FAC=2**SH;
if(SH){const SC=['line-width','text-size','text-halo-width','icon-size','text-padding','symbol-spacing','line-gap-width','line-offset','circle-radius','circle-stroke-width'];
 const fix=(v,scale)=>{if(Array.isArray(v)&&v[0]==='interpolate'&&Array.isArray(v[2])&&v[2][0]==='zoom'){return v.map((x,i)=>i>=3&&i%2===1?x+SH:(i>=4&&i%2===0&&scale?fix(x,scale):x))}
   if(typeof v==='number')return scale?v*FAC:v;
   if(Array.isArray(v)&&v[0]==='match')return v.map((x,i)=>i>=3&&(i%2===1||i===v.length-1)&&typeof x==='number'&&scale?x*FAC:x);
   return v};
 style.layers.forEach(l=>{if('minzoom' in l)l.minzoom+=SH;if('maxzoom' in l)l.maxzoom+=SH;
  for(const g of ['paint','layout']){const o=l[g];if(!o)continue;for(const k in o){if(['icon-text-fit-padding'].includes(k)){o[k]=o[k].map(x=>x*FAC);continue}
   o[k]=fix(o[k],SC.includes(k))}}
  })}
document.getElementById('map').style.width=(JOB.w*FAC)+'px';document.getElementById('map').style.height=(JOB.h*FAC)+'px';

const map=new maplibregl.Map({container:'map',style,center:JOB.center,zoom:JOB.zoom+SH,interactive:false,attributionControl:false,preserveDrawingBuffer:true,fadeDuration:0,maxCanvasSize:[8192,8192],pixelRatio:(JOB.ratio||2)/FAC});
function img(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x);return x.getImageData(0,0,w,h)}
map.on('load',()=>{
 const R=JOB.ratio||2;
 const sh=(fill,stroke)=>img(20*R,20*R,x=>{x.scale(R,R);x.fillStyle=fill;x.strokeStyle=stroke;x.lineWidth=1.2;x.beginPath();x.roundRect(1,1,18,18,3);x.fill();x.stroke()});
 const st={pixelRatio:R,stretchX:[[4*R,16*R]],stretchY:[[4*R,16*R]],content:[4*R,4*R,16*R,16*R]};
